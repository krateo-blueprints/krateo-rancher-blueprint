name: lint

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # krateo-blueprints/charts PUBLISHING.md rule 9: every reusable workflow this repository calls is pinned by
  # commit SHA with a version comment. The shared check refuses any that is not.
  pinned-uses:
    permissions:
      contents: read
    uses: krateo-blueprints/charts/.github/workflows/pinned-uses.yaml@70095ab05f1c5dc6c8dd39d0b1fdbbc7382a841c # 1.4.3

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Stamp a temporary chart version
        run: sed -i "s/CHART_VERSION/0.0.0-ci/g" ./chart/Chart.yaml

      - name: Lint
        run: helm lint ./chart

      - name: Render (default values)
        run: helm template rancher ./chart --namespace cattle-system > /dev/null

  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@e1d3e99215e80ae56eca4a67e9e061b2c73168b8 # 1.0.0
